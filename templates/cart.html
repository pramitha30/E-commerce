<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <h2>Your Cart</h2>
    <a href="/">Back to Store</a>
</nav>

<div class="container">

    {% if cart_items %}
        <table>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
            </tr>

            {% for item in cart_items %}
            <tr>
                <td>{{ item.name }}</td>
                <td>₹{{ item.price }}</td>
                <td>{{ item.quantity }}</td>
                <td>₹{{ item.subtotal }}</td>
            </tr>
            {% endfor %}
        </table>

        <h3>Total: ₹{{ total }}</h3>

    {% else %}
        <p>Your cart is empty.</p>
    {% endif %}

</div>

</body>
</html>
